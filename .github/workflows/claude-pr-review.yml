name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR at a time; a new push cancels the older review.
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by reading `.claude/skills/pr-review/SKILL.md`
            and following it exactly, including its "Running in CI" section.
            The PR branch is already checked out and all dependencies are installed.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment,Bash(uv run --directory backend ruff check:*),Bash(uv run --directory backend pytest:*),Bash(npm --prefix frontend run lint:*),Bash(npm --prefix frontend test:*),Bash(npm --prefix frontend run build:*)"
